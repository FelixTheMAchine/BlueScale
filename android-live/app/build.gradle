plugins { id 'com.android.application' }

def rawUrl = (project.findProperty('bluescaleUrl') ?: System.getenv('BLUESCALE_URL') ?: 'https://bluescale.example.invalid').toString().trim()
if (!(rawUrl ==~ /^https:\/\/[a-zA-Z0-9.-]+(:[0-9]{2,5})?(\/.*)?$/)) {
    throw new GradleException('BLUESCALE_URL deve ser uma URL HTTPS válida e sem credenciais.')
}
android {
    namespace 'br.com.das.bluescale'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.das.bluescale'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '1.0.0-online'
        buildConfigField 'String', 'APP_URL', '"' + rawUrl.replace('"','') + '"'
    }
    buildFeatures { buildConfig true }
    buildTypes { release { minifyEnabled false }; debug { debuggable true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
