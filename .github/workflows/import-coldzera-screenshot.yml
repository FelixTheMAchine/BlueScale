name: Import actual CS Mirage screenshot (one-time)
on:
  push:
    branches: ['fix/coldzera-real-game-screenshot']
    paths: ['.github/workflows/import-coldzera-screenshot.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/coldzera-real-game-screenshot
          persist-credentials: true
      - name: Fetch original Counter-Strike in-game screenshot of the Coldzera wall graffiti
        run: |
          set -euo pipefail
          mkdir -p public
          url='https://s2-ge.glbimg.com/DIivMNjdGz_Ev8P0aQlvHtw3WN4%3D/1920x0/filters%3Aformat%28jpeg%29/https%3A/i.s3.glbimg.com/v1/AUTH_bc8228b6673f488aa253bbcb03c80ec5/internal_photos/bs/2019/h/B/s2oNBPT2uYIOlMXAhh5Q/grafite-mirage.jpg'
          curl --fail --location --silent --show-error --retry 2 --max-time 55 -A 'Mozilla/5.0' "$url" -o public/coldzera-ingame.jpg || {
            echo 'Primary source failed, trying the game screenshot from Pley.gg'
            curl --fail --location --silent --show-error --retry 2 --max-time 55 \
              'https://pley.gg/wp-content/uploads/2024/12/MapsMirage123515827_1085478021917543_214307528968235524_n_s0n6ea-2.jpg' \
              -o public/coldzera-ingame.jpg
          }
          test "$(file --mime-type --brief public/coldzera-ingame.jpg)" = "image/jpeg"
          test "$(wc -c < public/coldzera-ingame.jpg)" -gt 3000
          file public/coldzera-ingame.jpg
          du -h public/coldzera-ingame.jpg
      - name: Save screenshot to the branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/coldzera-ingame.jpg
          git commit -m 'assets: add real CS Mirage in-game screenshot (Valve via ge)' || exit 0
          git push origin HEAD:fix/coldzera-real-game-screenshot
