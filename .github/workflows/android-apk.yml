name: BlueScale DAs - APK Android

on:
  push:
    branches: [main, master]
    paths:
      - 'android-app/**'
      - 'android-live/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      edition:
        description: 'Qual APK compilar? Online exige servidor HTTPS funcionando.'
        required: true
        type: choice
        options:
          - demo-offline
          - online
        default: online

permissions:
  contents: read

jobs:
  android:
    name: Compilar APK (${{ inputs.edition || 'online' }})
    runs-on: ubuntu-latest
    env:
      EDITION: ${{ inputs.edition || 'online' }}
      BLUESCALE_URL: ${{ vars.BLUESCALE_URL || 'https://bluescale-das-online.onrender.com' }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verificar Android SDK do runner
        run: |
          echo "Android SDK: ${ANDROID_HOME:-${ANDROID_SDK_ROOT:-indefinido}}"
          test -d "$ANDROID_HOME"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validar configuração online
        if: env.EDITION == 'online'
        run: |
          if [[ ! "$BLUESCALE_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{2,5})?(/.*)?$ ]]; then
            echo 'ERRO: Configure Settings > Secrets and variables > Actions > Variables > BLUESCALE_URL com seu domínio HTTPS público.'
            exit 1
          fi
          # O Render gratuito pode suspender por inatividade; aguarde cold start.
          ok=0
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --connect-timeout 15 --max-time 100 "$BLUESCALE_URL/api/health" | grep -q '"status":"ok"'; then
              ok=1
              break
            fi
            sleep 10
          done
          if [[ "$ok" -ne 1 ]]; then
            echo 'ERRO: BlueScale HTTPS /api/health indisponível. APK online não será publicado.'
            exit 1
          fi
      - name: Gerar APK demonstrativo local
        if: env.EDITION == 'demo-offline'
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug
      - name: Gerar APK conectado à nuvem
        if: env.EDITION == 'online'
        working-directory: android-live
        run: gradle --no-daemon :app:assembleDebug
      - name: Disponibilizar APK demonstrativo
        if: env.EDITION == 'demo-offline'
        uses: actions/upload-artifact@v4
        with:
          name: BlueScale-DAs-APK-Demo-Offline
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Disponibilizar APK online
        if: env.EDITION == 'online'
        uses: actions/upload-artifact@v4
        with:
          name: BlueScale-DAs-APK-Online
          path: android-live/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
