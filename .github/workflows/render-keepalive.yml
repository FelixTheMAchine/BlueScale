name: Render BlueScale keepalive

on:
  # Off peak hour, at most 14 minutes between scheduled slots.
  # GitHub's schedule is best-effort and can be delayed or skipped.
  schedule:
    - cron: '3-59/14 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-keepalive.yml'

permissions: {}

concurrency:
  group: bluescale-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: HTTP keepalive (sem consultar o PostgreSQL)
        run: |
          echo "Monitor: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl --fail --silent --show-error --location \
            --connect-timeout 12 --max-time 95 \
            --retry 2 --retry-delay 6 --retry-all-errors \
            --user-agent 'BlueScale-keepalive/1.3' \
            https://bluescale-das-online.onrender.com/api/ping
          echo

# This does not guarantee uptime. Free Render instances can sleep/restart,
# and scheduled GitHub Actions jobs can be delayed or skipped.
# Free Render PostgreSQL expiration is not affected by this workflow.
