name: Render BlueScale keepalive

on:
  # Back-up monitor only: GitHub schedules are best-effort, may be skipped.
  # Use a dedicated external HTTP monitor every 5 minutes for the primary ping.
  schedule:
    - cron: '3-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-keepalive.yml'

permissions: {}

concurrency:
  group: bluescale-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify lightweight BlueScale HTTP ping
        shell: bash
        run: |
          set -euo pipefail
          echo "Started: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl --fail --location --silent --show-error \
            --connect-timeout 15 --max-time 100 \
            --retry 2 --retry-delay 5 --retry-all-errors \
            --user-agent 'BlueScale-keepalive-GitHub-backup/2.0' \
            --write-out '\nHTTP %{http_code}; response time %{time_total}s\n' \
            https://bluescale-das-online.onrender.com/api/ping
          echo "Done: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

# Render Free sleeps after 15 minutes of no inbound traffic.
# Scheduled GitHub workflows are NOT guaranteed to run on time; this cron
# is a backup and cannot guarantee continuous uptime on its own.
# Free PostgreSQL expiry is separate.
